[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-buddy"
version = "1.3.0"
description = "CC - personality-driven voice companion for Claude Code"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "luyao618" }]
keywords = ["voice", "tts", "personality", "companion"]

# Floor is 3.10, not the 3.9 the README used to claim. Verified empirically:
# on 3.9 pyobjc-core ships no wheel and fails to build from source, and both
# pytest 9.x and pip 26.x declare Requires-Python >=3.10.
requires-python = ">=3.10"

classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

dependencies = [
    # Upper bounds are the next major, so a breaking release can't arrive
    # silently. edge-tts is the TTS backend; the API used here is Communicate().
    "edge-tts>=7.0,<8",
    # macOS-only: the F2 hotkey EventTap. The previous "<12.0" cap held Quartz
    # at 11.1 while pyobjc-core resolved to 12.x, so the two drifted apart.
    # 12.2.1 is verified to expose every CGEventTap symbol this package uses.
    'pyobjc-framework-Quartz>=10.0,<13; sys_platform == "darwin"',
]

[project.urls]
Homepage = "https://github.com/luyao618/voice-buddy"
Repository = "https://github.com/luyao618/voice-buddy"

[project.scripts]
voice-buddy = "voice_buddy.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pip-audit>=2.7",
]

[tool.setuptools]
# The plugin layout ships assets/, personas/, templates/, agents/, skills/ and
# hooks/ as plain repo directories that Claude Code reads by path, so only the
# Python package itself is packaged here.
packages = ["voice_buddy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
